  <text x="425" y="120" class="caption">02　首页 / 默认分组</text>
  <g transform="translate(425 140)"><rect class="dark" width="350" height="600" rx="26"/><use href="#bar-home"/><rect fill="#171a19" y="88" width="118" height="512"/>
    <rect fill="#1c3329" x="8" y="103" width="101" height="38" rx="8"/><text x="22" y="128" class="green" font-size="16">默认</text><text x="22" y="184" class="body">动态密码</text><text x="22" y="240" class="body">社交媒体</text><text x="22" y="296" class="body">游戏娱乐</text><text x="22" y="352" class="body">银行卡</text><text x="22" y="408" class="body">工作</text><text x="22" y="548" class="muted">⚙　设置</text><text x="22" y="578" class="muted">◷　安全日志</text>
    <text x="138" y="126" class="small">默认 · 未分组 · 2 条</text><line x1="138" y1="143" x2="328" y2="143" class="line"/>
    <text x="138" y="182" class="h">GitHub</text><text x="138" y="208" class="small">hexo · 尚未分组</text><line x1="138" y1="230" x2="328" y2="230" class="line"/>
    <text x="138" y="270" class="h">NAS</text><text x="138" y="296" class="small">admin · 尚未分组</text><line x1="138" y1="318" x2="328" y2="318" class="line"/>
    <text x="325" y="170" class="muted" font-size="15">A</text><text x="325" y="194" class="muted" font-size="15">B</text><text x="325" y="218" class="muted" font-size="15">C</text><text x="325" y="242" class="muted" font-size="15">D</text>
    <text x="138" y="364" class="small">从当前分组新建 → 保存后保持未分组</text>
  </g>

  <!-- 03 home dynamic -->
  <text x="810" y="120" class="caption">03　首页 / 动态密码</text>
  <g transform="translate(810 140)"><rect class="dark" width="350" height="600" rx="26"/><use href="#bar-home"/><rect fill="#171a19" y="88" width="118" height="512"/>
    <text x="22" y="128" class="body">默认</text><rect fill="#1c3329" x="8" y="151" width="101" height="38" rx="8"/><text x="22" y="176" class="green" font-size="16">动态密码</text><text x="22" y="240" class="body">社交媒体</text><text x="22" y="296" class="body">游戏娱乐</text><text x="22" y="352" class="body">银行卡</text><text x="22" y="408" class="body">工作</text><text x="22" y="548" class="muted">⚙　设置</text><text x="22" y="578" class="muted">◷　安全日志</text>
    <text x="138" y="126" class="small">动态密码 · 2 条</text><line x1="138" y1="143" x2="328" y2="143" class="line"/>
    <text x="138" y="182" class="h">GitHub</text><text x="138" y="221" class="otp">123 456</text><text x="277" y="182" class="green" font-size="13">18 秒</text><text x="138" y="249" class="small">hexo · 工作</text><text x="290" y="249" class="green" font-size="13">复制</text><line x1="138" y1="268" x2="328" y2="268" class="line"/>
    <text x="138" y="308" class="h">Gmail</text><text x="138" y="347" class="otp">864 209</text><text x="277" y="308" class="green" font-size="13">18 秒</text><text x="138" y="375" class="small">name@example.com</text><text x="290" y="375" class="green" font-size="13">复制</text><text x="138" y="430" class="small">动态密码由 TOTP 配置自动进入</text>
  </g>

  <!-- 04 groups -->
  <text x="1195" y="120" class="caption">04　分组 / 标签管理</text>
  <g transform="translate(1195 140)"><rect class="light" width="350" height="600" rx="26"/><use href="#bar-back-light"/><text x="56" y="72" class="white" font-size="22">分组管理</text><text x="273" y="72" class="white" font-size="14">＋ 新增</text>
    <text x="24" y="125" class="label-light">固定分组（可改名）</text><text x="24" y="163" class="body-light">默认</text><text x="275" y="163" class="small-light">24 条　固定</text><line x1="24" y1="179" x2="326" y2="179" class="line-light"/><text x="24" y="214" class="body-light">动态密码</text><text x="275" y="214" class="small-light">3 条　TOTP</text>
    <text x="24" y="260" class="label-light">自定义分组</text><text x="24" y="289" class="body-light">社交媒体</text><text x="275" y="289" class="small-light">8 条</text><line x1="300" y1="275" x2="326" y2="275" class="handle"/><line x1="300" y1="284" x2="326" y2="284" class="handle"/><line x1="300" y1="293" x2="326" y2="293" class="handle"/>
    <rect class="surface-light shadow" x="34" y="313" width="282" height="59" rx="12"/><text x="50" y="349" class="body-light">游戏娱乐</text><text x="267" y="349" class="small-light">6 条</text><line x1="286" y1="330" x2="310" y2="330" class="handle"/><line x1="286" y1="339" x2="310" y2="339" class="handle"/><line x1="286" y1="348" x2="310" y2="348" class="handle"/><text x="320" y="338" class="green2" font-size="18">↕</text>
    <text x="24" y="407" class="body-light">银行卡</text><text x="275" y="407" class="small-light">3 条</text><line x1="300" y1="393" x2="326" y2="393" class="handle"/><line x1="300" y1="402" x2="326" y2="402" class="handle"/><line x1="300" y1="411" x2="326" y2="411" class="handle"/>
    <text x="24" y="454" class="small-light">长按手柄：行浮起、放大、阴影跟随手指</text><rect class="button" x="50" y="500" width="250" height="54" rx="20"/><text x="175" y="534" class="button-text" text-anchor="middle">添加新分组</text>
  </g>

  <!-- 05 details -->
  <text x="40" y="800" class="caption">05　账号详情 / 速览</text>
  <g transform="translate(40 820)"><rect class="dark" width="350" height="600" rx="26"/><use href="#bar-back-dark"/><text x="56" y="72" class="white" font-size="22">GitHub</text><text x="292" y="72" class="white" font-size="14">编辑</text><text x="24" y="126" class="green">[工作]</text><text x="24" y="168" class="label">登录信息</text><text x="24" y="205" class="small">用户名</text><text x="24" y="230" class="body">hexo</text><text x="287" y="230" class="green" font-size="13">复制</text><line x1="24" y1="246" x2="326" y2="246" class="line"/><text x="24" y="282" class="small">密码</text><text x="24" y="307" class="body">••••••••</text><text x="287" y="307" class="green" font-size="13">复制</text><text x="24" y="351" class="label">两步验证</text><text x="24" y="390" class="h">GitHub</text><text x="24" y="428" class="otp">123 456</text><text x="266" y="390" class="green" font-size="13">18 秒</text><text x="287" y="428" class="green" font-size="13">复制</text><line x1="24" y1="448" x2="326" y2="448" class="line"/><text x="24" y="484" class="small">恢复码　已保存</text><text x="24" y="520" class="small">备注　工作账号</text><text x="24" y="565" class="muted">密码点击显示，关闭页面后自动恢复掩码</text>
  </g>

  <!-- 06 edit -->
  <text x="425" y="800" class="caption">06　新建 / 编辑账号</text>
  <g transform="translate(425 820)"><rect class="dark" width="350" height="600" rx="26"/><use href="#bar-back-dark"/><text x="56" y="72" class="white" font-size="21">新建账号</text><text x="292" y="72" class="white" font-size="14">保存</text><text x="24" y="126" class="label">账号名称 *</text><rect class="surface" x="24" y="139" width="302" height="43" rx="10"/><text x="38" y="167" class="body">GitHub</text><text x="24" y="219" class="label">分组</text><rect fill="#1c3329" x="24" y="232" width="62" height="31" rx="16"/><text x="38" y="253" class="green" font-size="14">工作</text><rect fill="#1c3329" x="94" y="232" width="92" height="31" rx="16"/><text x="108" y="253" class="green" font-size="14">＋ 添加组</text><text x="24" y="303" class="label">字段　　可拖动排序</text><text x="24" y="341" class="body">☷　用户名</text><text x="210" y="341" class="small">hexo</text><text x="302" y="341" class="muted">⋮</text><line x1="24" y1="353" x2="326" y2="353" class="line"/><text x="24" y="389" class="body">☷　密码</text><text x="210" y="389" class="small">••••••••</text><text x="302" y="389" class="muted">⋮</text><line x1="24" y1="401" x2="326" y2="401" class="line"/><text x="24" y="441" class="green" font-size="14">＋ 新增字段</text><text x="140" y="441" class="green" font-size="14">＋ 新增隐藏字段</text><text x="24" y="489" class="body">两步验证</text><text x="274" y="489" class="green" font-size="14">扫描 / 手动 ›</text><text x="24" y="555" class="danger" font-size="15">删除账号</text>
  </g>

  <!-- 07 scan -->
  <text x="810" y="800" class="caption">07　扫描 2FA 二维码</text>
  <g transform="translate(810 820)"><rect class="dark" width="350" height="600" rx="26"/><use href="#bar-back-dark"/><text x="56" y="72" class="white" font-size="20">扫描两步验证</text><rect x="38" y="150" width="274" height="274" rx="16" fill="#0f1312" stroke="#35d28c" stroke-width="2"/><path d="M59 190v-22h22 M269 168h22v22 M59 384v22h22 M269 406h22v-22" fill="none" stroke="#35d28c" stroke-width="4"/><path d="M108 220h30v30h-30z M207 220h30v30h-30z M108 319h30v30h-30z M168 279h30v30h-30z M228 319h9v30h-9z" fill="#35d28c"/><text x="175" y="470" class="body" text-anchor="middle">将二维码放入取景框</text><text x="175" y="505" class="small" text-anchor="middle">仅识别 otpauth:// 格式</text><rect class="button" x="68" y="535" width="214" height="42" rx="18"/><text x="175" y="562" class="button-text" text-anchor="middle">手动输入密钥</text>
  </g>

  <!-- 08 confirm -->
  <text x="1195" y="800" class="caption">08　确认 2FA 配置</text>
  <g transform="translate(1195 820)"><rect class="light" width="350" height="600" rx="26"/><use href="#bar-back-light"/><text x="56" y="72" class="white" font-size="20">确认两步验证</text><text x="292" y="72" class="white" font-size="14">保存</text><text x="24" y="132" class="label-light">发行方</text><text x="24" y="158" class="body-light">GitHub</text><line x1="24" y1="174" x2="326" y2="174" class="line-light"/><text x="24" y="211" class="label-light">账号</text><text x="24" y="237" class="body-light">hexo</text><line x1="24" y1="253" x2="326" y2="253" class="line-light"/><text x="24" y="290" class="label-light">密钥</text><text x="24" y="316" class="body-light">JBSW •••• ••••</text><line x1="24" y1="332" x2="326" y2="332" class="line-light"/><text x="24" y="370" class="label-light">参数</text><text x="24" y="397" class="body-light">6 位　·　30 秒　·　SHA-1</text><rect class="button" x="24" y="450" width="302" height="50" rx="20"/><text x="175" y="482" class="button-text" text-anchor="middle">保存到此账号</text><text x="175" y="545" class="small-light" text-anchor="middle">保存后自动显示在“动态密码”分组</text>
  </g>

  <!-- 09 logs -->
  <text x="40" y="1500" class="caption">09　安全日志</text>
  <g transform="translate(40 1520)"><rect class="dark" width="350" height="600" rx="26"/><rect class="top" width="350" height="88" rx="22"/><rect class="top" y="62" width="350" height="26"/><use href="#status-dark"/><text x="18" y="72" class="white" font-size="22">安全日志</text><text x="289" y="72" class="white" font-size="14">筛选</text><rect fill="#1c3329" x="22" y="112" width="82" height="30" rx="15"/><text x="35" y="132" class="green" font-size="13">全部事件</text><rect class="surface" x="112" y="112" width="72" height="30" rx="15"/><text x="127" y="132" class="small" font-size="13">近 7 天</text><text x="22" y="185" class="label">今天</text><line x1="32" y1="201" x2="32" y2="432" class="line"/><circle cx="32" cy="220" r="5" fill="#35d28c"/><text x="50" y="224" class="body">已复制密码</text><text x="50" y="246" class="small">GitHub · 10:20</text><circle cx="32" cy="285" r="5" fill="#8fc7ff"/><text x="50" y="289" class="body">已打开账号</text><text x="50" y="311" class="small">GitHub · 10:18</text><circle cx="32" cy="350" r="5" fill="#35d28c"/><text x="50" y="354" class="body">已复制验证码</text><text x="50" y="376" class="small">Gmail · 09:52</text><text x="22" y="454" class="label">昨天</text><text x="22" y="490" class="body">WebDAV 备份完成</text><text x="22" y="512" class="small">21:06 · 加密备份</text><text x="22" y="570" class="muted">日志只保存事件类型，不记录敏感值</text>
  </g>

