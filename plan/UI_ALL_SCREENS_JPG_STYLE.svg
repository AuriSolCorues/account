<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2260" viewBox="0 0 1600 2260">
  <defs>
    <style>
      .board{fill:#0d1110}.dark{fill:#151817;stroke:#2c332f;stroke-width:2}.light{fill:#fbfcfb;stroke:#d9dfdc;stroke-width:2}
      .top{fill:#006b46}.top2{fill:#00965f}.surface{fill:#202322}.surface2{fill:#272b29}.surface-light{fill:#f1f4f2}.white{fill:#f3f6f4}.ink{fill:#25312b}
      .green{fill:#35d28c}.green2{fill:#00965f}.muted{fill:#8c9791}.muted-dark{fill:#66726b}.line{stroke:#303733;stroke-width:1}.line-light{stroke:#e0e6e2;stroke-width:1}
      .title{fill:#f0f4f1;font:700 32px sans-serif}.intro{fill:#93a09a;font:15px sans-serif}.caption{fill:#d9e1dc;font:700 17px sans-serif}
      .h{fill:#f0f4f1;font:700 21px sans-serif}.body{fill:#e6ece8;font:16px sans-serif}.body-light{fill:#27332d;font:16px sans-serif}.small{fill:#a7b2ac;font:13px sans-serif}.small-light{fill:#6d7872;font:13px sans-serif}.label{fill:#94a099;font:13px sans-serif}.label-light{fill:#7b8780;font:13px sans-serif}
      .button{fill:#00965f}.button-text{fill:#fff;font:700 16px sans-serif}.danger{fill:#ff7070}.warning{fill:#e2b34e}.otp{fill:#35d28c;font:700 29px monospace;letter-spacing:2px}.otp-light{fill:#008a58;font:700 29px monospace;letter-spacing:2px}
      .phone-label{fill:#bed0c6;font:700 16px sans-serif}.status{fill:#e9f1ec;font:12px sans-serif}.handle{stroke:#9ea8a2;stroke-width:3;stroke-linecap:round}.shadow{filter:url(#ds)}
    </style>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
    <g id="status-dark"><text x="18" y="26" class="status">12:05</text><text x="250" y="26" class="status">4G　▮▮　51%　ϟ</text></g>
    <g id="status-light"><text x="18" y="26" fill="#fff" font-size="12" font-family="sans-serif">12:05</text><text x="250" y="26" fill="#fff" font-size="12" font-family="sans-serif">4G　▮▮　51%　ϟ</text></g>
    <g id="bar-home"><rect class="top" width="350" height="88" rx="22"/><rect class="top" y="62" width="350" height="26"/><use href="#status-dark"/><text x="18" y="72" class="white" font-size="22">账号本子</text><text x="255" y="73" class="white" font-size="27">＋</text><text x="292" y="72" class="white" font-size="25">⌕</text><text x="320" y="72" class="white" font-size="23">☰</text></g>
    <g id="bar-back-dark"><rect class="top" width="350" height="88" rx="22"/><rect class="top" y="62" width="350" height="26"/><use href="#status-dark"/><text x="18" y="72" class="white" font-size="28">‹</text></g>
    <g id="bar-back-light"><rect class="top2" width="350" height="88" rx="22"/><rect class="top2" y="62" width="350" height="26"/><use href="#status-light"/><text x="18" y="72" class="white" font-size="28">‹</text></g>
  </defs>

  <rect class="board" width="1600" height="2260"/>
  <text x="54" y="52" class="title">账号本子 · JPG 风格全界面设计</text>
  <text x="54" y="80" class="intro">12 个页面统一采用深绿顶栏、扁平列表和大留白；动态密码使用正常绿色文字，不使用黄色。</text>

  <!-- 01 unlock -->
  <text x="40" y="120" class="caption">01　解锁</text>
  <g transform="translate(40 140)"><rect class="dark" width="350" height="600" rx="26"/><rect class="top" width="350" height="88" rx="22"/><rect class="top" y="62" width="350" height="26"/><use href="#status-dark"/>
    <text x="24" y="72" class="white" font-size="23">账号本子</text><text x="24" y="154" class="h">欢迎回来</text><text x="24" y="181" class="small">本地加密保存，解锁后才能查看账号</text>
    <circle cx="175" cy="260" r="47" fill="#1c3329" stroke="#35d28c" stroke-width="2"/><text x="157" y="273" class="green" font-size="43">◉</text><text x="118" y="336" class="body">请验证身份以解锁</text>
    <rect class="surface" x="22" y="378" width="306" height="52" rx="12"/><text x="38" y="410" class="small">主密码</text><text x="263" y="410" class="body">••••••••</text><text x="24" y="469" class="green" text-anchor="middle" font-size="16">使用主密码</text>
    <text x="175" y="548" class="small" text-anchor="middle">指纹 / 面容优先，失败后可回退主密码</text>
  </g>

