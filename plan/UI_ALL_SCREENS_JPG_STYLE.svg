  <text x="425" y="1500" class="caption">10　日志筛选</text>
  <g transform="translate(425 1520)"><rect class="light" width="350" height="600" rx="26"/><use href="#bar-back-light"/><text x="56" y="72" class="white" font-size="21">筛选日志</text><text x="292" y="72" class="white" font-size="14">重置</text><text x="24" y="132" class="label-light">时间范围</text><rect class="surface-light" x="24" y="145" width="302" height="43" rx="10"/><text x="38" y="172" class="body-light">近 7 天　　　　　　　　　›</text><text x="24" y="231" class="label-light">关联账号</text><rect class="surface-light" x="24" y="244" width="302" height="43" rx="10"/><text x="38" y="271" class="body-light">所有账号　　　　　　　›</text><text x="24" y="330" class="label-light">事件类型</text><rect fill="#d7f1e4" x="24" y="343" width="55" height="30" rx="15"/><text x="40" y="363" class="green2" font-size="13">复制</text><rect class="surface-light" x="87" y="343" width="55" height="30" rx="15"/><text x="102" y="363" class="small-light">打开</text><rect class="surface-light" x="150" y="343" width="55" height="30" rx="15"/><text x="165" y="363" class="small-light">备份</text><rect class="button" x="24" y="430" width="302" height="50" rx="20"/><text x="175" y="462" class="button-text" text-anchor="middle">应用筛选</text>
  </g>

  <!-- 11 settings -->
  <text x="810" y="1500" class="caption">11　设置</text>
  <g transform="translate(810 1520)"><rect class="dark" width="350" height="600" rx="26"/><rect class="top" width="350" height="88" rx="22"/><rect class="top" y="62" width="350" height="26"/><use href="#status-dark"/><text x="18" y="72" class="white" font-size="22">设置</text><text x="24" y="124" class="label">安全</text><rect class="surface" x="18" y="138" width="314" height="126" rx="18"/><text x="34" y="174" class="body">后台自动锁定</text><text x="267" y="174" class="green" font-size="14">5 分钟 ›</text><line x1="34" y1="190" x2="316" y2="190" class="line"/><text x="34" y="226" class="body">指纹 / 面容解锁</text><rect class="button" x="266" y="207" width="46" height="26" rx="13"/><circle cx="296" cy="220" r="10" fill="#e8f1eb"/><text x="24" y="302" class="label">外观与主题</text><rect class="surface" x="18" y="316" width="314" height="98" rx="18"/><text x="34" y="350" class="body">主题颜色</text><rect fill="#006b46" x="177" y="333" width="42" height="24" rx="12"/><rect fill="#2f75d6" x="227" y="333" width="42" height="24" rx="12"/><text x="34" y="388" class="small">深色　　浅色　　跟随系统（预留扩展）</text><text x="24" y="450" class="label">数据</text><rect class="surface" x="18" y="464" width="314" height="51" rx="17"/><text x="34" y="497" class="body">备份与 WebDAV　　　　　　　›</text><rect class="surface" x="18" y="527" width="314" height="51" rx="17"/><text x="34" y="560" class="danger">抹掉本地所有数据　　　　　›</text>
