<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <style>
      .canvas{fill:#101111}.phone-dark{fill:#151616;stroke:#333735;stroke-width:2}.phone-light{fill:#fafafa;stroke:#d8ddd9;stroke-width:2}
      .bar-green{fill:#006b46}.bar-green-light{fill:#00965f}.panel-dark{fill:#222323}.panel-light{fill:#ffffff}.line-dark{stroke:#303332;stroke-width:1}.line-light{stroke:#e1e5e2;stroke-width:1}
      .title{fill:#f2f5f3;font:700 30px sans-serif}.subtitle{fill:#929a96;font:14px sans-serif}.label{fill:#b6bfba;font:700 15px sans-serif}.body{fill:#e7ebe8;font:16px sans-serif}.muted{fill:#79827d;font:13px sans-serif}.green{fill:#43d596}.green-text{fill:#00965f;font:700 17px sans-serif}.white{fill:#fff}.danger{fill:#ff6d6d}.warning{fill:#e5b84c}.phone-caption{fill:#d4dad6;font:700 17px sans-serif}.phone-caption-dark{fill:#1a2b23;font:700 17px sans-serif}.handle{stroke:#9da49f;stroke-width:3;stroke-linecap:round}.small{font:12px sans-serif}.switch-on{fill:#00965f}.switch-knob{fill:#e8eeea}.switch-off{fill:#343736}.button{fill:#00965f}.button-text{fill:#fff;font:700 17px sans-serif}.account-code{fill:#e8eeeb;font:700 24px monospace;letter-spacing:2px}.icon{fill:#e7ebe8;font:28px sans-serif}.index{fill:#505753;font:13px sans-serif}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="1060"/>
  <text x="64" y="62" class="title">账号本子 · JPG 风格前端重设计</text>
  <text x="64" y="92" class="subtitle">扁平列表、大留白、深绿顶栏；动态密码使用正常文字色，分组长按后浮动跟手。</text>

  <!-- dark home -->
  <text x="70" y="140" class="phone-caption">01 首页 / 动态密码</text>
  <g transform="translate(64 160)">
    <rect class="phone-dark" width="430" height="780" rx="26"/>
    <rect class="bar-green" width="430" height="112" rx="26"/>
    <rect class="bar-green" y="78" width="430" height="34"/>
    <text x="24" y="42" class="white" font-size="14">12:05</text><text x="330" y="42" class="white" font-size="13">4G　▮▮ 51%</text>
    <text x="24" y="91" class="white" font-size="24">账号本子</text><text x="300" y="92" class="icon">＋</text><text x="348" y="92" class="icon">⌕</text><text x="390" y="92" class="icon">☰</text>
    <rect fill="#171818" x="0" y="112" width="152" height="668"/>
    <text x="24" y="166" class="green-text">动态密码</text>
    <text x="24" y="226" class="body">全部账号</text>
    <text x="24" y="286" class="body">我的收藏</text>
    <text x="24" y="378" class="body">社交媒体</text>
    <text x="24" y="438" class="body">游戏娱乐</text>
    <text x="24" y="498" class="body">银行卡</text>
    <text x="24" y="704" class="muted">⚙　设置</text>
    <text x="24" y="744" class="muted">◷　安全日志</text>
    <text x="184" y="166" class="muted">动态密码 · 2 条</text>
    <text x="184" y="224" class="body">STEAM（Demo）</text>
    <text x="184" y="264" class="account-code"># # # # # #</text>
    <text x="184" y="302" class="muted">hexo · 游戏娱乐</text>
    <line x1="184" y1="326" x2="404" y2="326" class="line-dark"/>
    <text x="184" y="374" class="body">GitHub</text><text x="350" y="374" class="green small">18 秒</text>
    <text x="184" y="412" class="account-code">123 456</text><text x="350" y="412" class="green small">复制</text>
    <text x="184" y="446" class="muted">hexo · 工作</text>
    <line x1="184" y1="470" x2="404" y2="470" class="line-dark"/>
    <text x="405" y="192" class="index">A</text><text x="405" y="220" class="index">B</text><text x="405" y="248" class="index">C</text><text x="405" y="276" class="index">D</text><text x="405" y="304" class="index">E</text><text x="405" y="332" class="index">F</text><text x="405" y="360" class="index">G</text><text x="405" y="388" class="index">H</text><text x="405" y="416" class="index">I</text><text x="405" y="444" class="index">J</text>
  </g>

  <!-- dark settings -->
  <text x="585" y="140" class="phone-caption">02 设置 / JPG 深色风格</text>
  <g transform="translate(575 160)">
    <rect class="phone-dark" width="430" height="780" rx="26"/>
    <rect class="bar-green" width="430" height="112" rx="26"/><rect class="bar-green" y="78" width="430" height="34"/>
    <text x="24" y="42" class="white" font-size="14">12:05</text><text x="330" y="42" class="white" font-size="13">4G　▮▮ 51%</text><text x="24" y="91" class="white" font-size="24">‹　设置</text>
    <text x="28" y="156" class="muted">安全</text>
    <rect class="panel-dark" x="18" y="176" width="394" height="218" rx="20"/>
    <text x="42" y="218" class="body">启动时需要验证密码</text><rect class="switch-on" x="340" y="194" width="52" height="30" rx="16"/><circle class="switch-knob" cx="377" cy="209" r="12"/>
    <text x="42" y="278" class="body">面容/指纹 ID 快速解锁</text><rect class="switch-on" x="340" y="254" width="52" height="30" rx="16"/><circle class="switch-knob" cx="377" cy="269" r="12"/>
    <text x="42" y="338" class="body">多任务页面截屏保护</text><rect class="switch-off" x="340" y="314" width="52" height="30" rx="16"/><circle class="switch-knob" cx="355" cy="329" r="12"/>
    <text x="28" y="438" class="muted">显示</text>
    <rect class="panel-dark" x="18" y="458" width="394" height="138" rx="20"/>
    <text x="42" y="502" class="body">首页显示动态密码标签</text><rect class="switch-on" x="340" y="478" width="52" height="30" rx="16"/><circle class="switch-knob" cx="377" cy="493" r="12"/>
    <text x="42" y="558" class="body">账号列表只显示名称</text><rect class="switch-off" x="340" y="534" width="52" height="30" rx="16"/><circle class="switch-knob" cx="355" cy="549" r="12"/>
    <rect class="panel-dark" x="18" y="634" width="394" height="62" rx="20"/>
    <text x="42" y="674" class="danger">抹掉本地所有数据</text><text x="372" y="674" class="danger" font-size="24">›</text>
    <text x="28" y="738" class="muted">自动锁定　　1 分钟　　　　　　　　　›</text>
  </g>

  <!-- light tag management -->
  <text x="1095" y="140" class="phone-caption">03 标签管理 / JPG 浅色风格</text>
  <g transform="translate(1085 160)">
    <rect class="phone-light" width="430" height="780" rx="26"/>
    <rect class="bar-green-light" width="430" height="112" rx="26"/><rect class="bar-green-light" y="78" width="430" height="34"/>
    <text x="24" y="42" class="white" font-size="14">12:05</text><text x="330" y="42" class="white" font-size="13">4G　▮▮ 51%</text><text x="24" y="91" class="white" font-size="24">‹　　标签管理</text>
    <text x="42" y="174" fill="#29322e" font-size="22">社交媒体</text><line x1="42" y1="198" x2="388" y2="198" class="line-light"/><line x1="356" y1="164" x2="388" y2="164" class="handle"/><line x1="356" y1="174" x2="388" y2="174" class="handle"/><line x1="356" y1="184" x2="388" y2="184" class="handle"/>
    <text x="42" y="270" fill="#29322e" font-size="22">游戏娱乐</text><line x1="42" y1="294" x2="388" y2="294" class="line-light"/><line x1="356" y1="260" x2="388" y2="260" class="handle"/><line x1="356" y1="270" x2="388" y2="270" class="handle"/><line x1="356" y1="280" x2="388" y2="280" class="handle"/>
    <text x="42" y="366" fill="#29322e" font-size="22">银行卡</text><line x1="42" y1="390" x2="388" y2="390" class="line-light"/><line x1="356" y1="356" x2="388" y2="356" class="handle"/><line x1="356" y1="366" x2="388" y2="366" class="handle"/><line x1="356" y1="376" x2="388" y2="376" class="handle"/>
    <text x="42" y="438" fill="#8b938f" font-size="14">长按右侧手柄即可拖动排序</text>
    <rect class="button" x="76" y="666" width="278" height="64" rx="24"/><text x="142" y="706" class="button-text">添加新标签</text>
  </g>

  <!-- notes -->
  <g transform="translate(64 1000)">
    <circle cx="8" cy="0" r="6" fill="#00965f"/><text x="24" y="5" class="subtitle">绿色：主操作 / 选中 / 开启状态</text>
    <circle cx="300" cy="0" r="6" fill="#ff6d6d"/><text x="316" y="5" class="subtitle">红色：危险操作</text>
    <circle cx="520" cy="0" r="6" fill="#e5b84c"/><text x="536" y="5" class="subtitle">黄色：仅提醒，不用于动态密码</text>
    <text x="920" y="5" class="subtitle">拖动：浮起 + 跟手 + 邻项让位</text>
  </g>
</svg>
